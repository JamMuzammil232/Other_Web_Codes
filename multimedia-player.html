<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Multimedia Player</h1>

  <section>
    <h2>Sailing Away</h2>
    <audio
    controls
    aria-label="Audio player for sailing away">
    <source
    src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mp3">
    </audio>
  </section>

  <section>
  <h2>What is the Map Method and how does it Work</h2>
  <video
  controls
  aria-label="Video about the map method"
  width="600"
  height="280"
  type="video/mp4">
  <source
  src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
  type="video/mp4">
  <track
  src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
  kind="subtitles"
  srclang="en"
  label="English">
  </section>

  <section>
    <h2>Transcript</h2>
    <p>The map method is a higher-order function in JavaScript that creates a new array by applying a callback function to every element in the original array.</p>
  </section>

</body>

</html>
